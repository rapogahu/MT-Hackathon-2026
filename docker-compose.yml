services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mttech-backend
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/project/dataset:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mttech-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped